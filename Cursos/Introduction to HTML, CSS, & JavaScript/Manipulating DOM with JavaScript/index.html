<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        /* Styles the main container of the to-do list */
        .todo-container {
            width: 300px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        
        /* Removes default list styling for the to-do list */
        .todo-list {
            list-style-type: none;
            padding: 0;
        }

        /* Styles each list item in the to-do list */
        li {
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Adds spacing for buttons in list items */
        button {
            margin-left: 10px;
        }
    </style>
</head>
<body>

<div class="todo-container">
    <h1>To-Do List</h1>

    <!-- Input field to add new tasks -->
    <input type="text" id="taskInput" placeholder="Add a new task">
    
    <!-- Button to add a new task to the list -->
    <button class="add-btn" onclick="addTask()">Add Task</button>
    
    <!-- Unordered list to display the tasks -->
    <ul class="todo-list" id="todoList"></ul>
</div>


<script>
    function addTask() {
    const input = document.getElementById("taskInput");
    const taskText = input.value.trim(); // Trim = Formata a String removendo espacos desnecessarios!

    if (taskText !== "") { //Se for diferente de vazio

        const ul = document.getElementById("todoList"); //Pega lista.

        const li = document.createElement("li");//Cria um elemento para o lista.

        const span = document.createElement("span"); //Criando o contêiner para a lista.
        span.textContent = taskText; //Mostrando na tela o traskText.

        const editButton = document.createElement("button"); //Criando um botao
        editButton.textContent = "Edit"; //Dando um nome para o botao(da pra ver na tela)
        editButton.onclick = () => editTask(span); //Atribuindo uma funcao ao clica-lo atraves da arrow funciton que passara como parametro o span seguindo a hierarquia do DOM.

        const removeButton = document.createElement("button");
        removeButton.textContent = "Delete";
        removeButton.onclick = () => removeTask(li); //

        li.appendChild(span); //Colocando o no span como filho do elemento da lista na arvore do DOM.
        li.appendChild(editButton); //Colocando o botao edit como filho do elemento da lista na arvore do DOM.
        li.appendChild(removeButton); //Colocando o botao remove como filho do elemento da lista na arvore do DOM.

        ul.appendChild(li); //Colocando o elemento list como filho da lista.

        input.value = ""; //Limpando o input escrito pelo usuario.
    }
    else {
            alert("Please enter a valid task."); //Alertando caso o usuario nao tenha escrito nada!
        }
}

function editTask(span) {
    // Prompt the user to enter a new task description
    const newTask = prompt("Edit your task:", span.textContent);
    
    // Update the task only if the input is not null or empty
    if (newTask !== null && newTask.trim() !== "") {
        span.textContent = newTask.trim(); // Set the new task text
    }
}

// Function to remove a task from the to-do list
function removeTask(task) {
    const ul = document.getElementById("todoList"); // Get the list container
    ul.removeChild(task); // Remove the specified task element
}

</script>
</body>
</html>
